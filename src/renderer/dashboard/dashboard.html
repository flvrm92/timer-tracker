<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>Dashboard</title>
  <link rel="stylesheet" type="text/css" href="../../shared/styles/app.css" />
  <style>
    .dashboard-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-5);
    }

    .dashboard-head h1 {
      margin: 0;
    }

    .head-meta {
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
    }

    /* KPI tiles - a definition list so each value keeps its label. */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: var(--space-4);
      margin: 0;
    }

    .kpi {
      background-color: var(--color-background);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
    }

    .kpi dt {
      margin: 0 0 var(--space-1);
      font-size: var(--font-size-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-secondary);
      font-weight: var(--font-weight-semibold);
    }

    .kpi dd {
      margin: 0;
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-tight);
      font-variant-numeric: tabular-nums;
    }

    .kpi .kpi-sub {
      display: block;
      margin-top: var(--space-1);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-normal);
      color: var(--color-text-muted);
    }

    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-4);
    }

    .block-head h2 {
      margin: 0;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    th.num {
      text-align: right;
    }

    .table tfoot td {
      background-color: var(--color-surface);
      font-weight: var(--font-weight-semibold);
      border-top: 2px solid var(--color-border);
    }

    .badge {
      display: inline-block;
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-billable {
      background-color: var(--color-success-bg);
      color: var(--color-success-text);
      border-color: var(--color-success-border);
    }

    .badge-internal {
      background-color: var(--color-surface-hover);
      color: var(--color-text-secondary);
      border-color: var(--color-border);
    }

    .chart-controls {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .chart-canvas-wrap {
      position: relative;
      height: 320px;
    }

    .chart-note {
      margin: var(--space-3) 0 0;
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    .inline-note {
      display: block;
      margin-top: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-base);
      background-color: var(--color-surface-hover);
      border: 1px solid var(--color-border);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    .status-message {
      margin-bottom: var(--space-4);
      padding: var(--space-3);
      border-radius: var(--radius-base);
      font-size: var(--font-size-sm);
      display: none;
    }

    .status-message.error {
      display: block;
      background-color: var(--color-error);
      color: var(--color-error-text);
      border: 1px solid var(--color-error-border);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
      color: var(--color-text-secondary);
    }

    @media (max-width: 768px) {
      .block-head {
        flex-direction: column;
        align-items: stretch;
      }

      .chart-canvas-wrap {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="block">
      <header class="dashboard-head">
        <h1>Dashboard</h1>
        <span class="head-meta" id="head-meta"></span>
      </header>

      <div id="status-message" class="status-message" role="alert"></div>

      <dl class="kpi-row" id="kpi-row"></dl>
    </div>

    <div class="block">
      <div class="block-head">
        <h2>Projects</h2>
        <span class="head-meta">Highest earning first</span>
      </div>

      <div style="overflow-x: auto;">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">Project</th>
              <th scope="col">Type</th>
              <th scope="col" class="num">Rate / h</th>
              <th scope="col" class="num">Hours</th>
              <th scope="col" class="num">Entries</th>
              <th scope="col" class="num">Earned</th>
              <th scope="col">Last entry</th>
            </tr>
          </thead>
          <tbody id="projects-body"></tbody>
          <tfoot id="projects-foot"></tfoot>
        </table>
      </div>
    </div>

    <div class="block">
      <div class="block-head">
        <h2 id="chart-title">Earnings per month</h2>
        <div class="chart-controls">
          <label for="chart-project" class="form-label">Project:</label>
          <select id="chart-project" class="form-select"></select>
        </div>
      </div>

      <div class="chart-canvas-wrap">
        <canvas id="earnings-chart" role="img" aria-label="Monthly earnings chart"></canvas>
      </div>
      <p class="chart-note" id="chart-note"></p>
      <span class="inline-note" id="chart-inline-note" hidden></span>
    </div>
  </div>

  <script src="../vendor/chart.umd.js"></script>
  <script src="../../shared/utils/escapeHtml.js"></script>
  <script src="../../shared/utils/theme.js"></script>
  <script src="../../shared/utils/dateHelper.js"></script>
  <script src="../../shared/utils/numberHelper.js"></script>
  <script src="../../shared/components/runningTimer.js"></script>
  <script src="dashboard.js"></script>
</body>

</html>
