<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Timer Tracker app mark.

    The clock is the `clock` entry from src/shared/components/icons.js
    (heroicons path "M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z") scaled 17x
    about its own centre so the app icon and the in-app iconography read as one
    family. Stroke weight is deliberately heavy so the mark survives the 16x16
    downscale used for the taskbar and Explorer.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <g fill="none" stroke="#ffffff" stroke-width="34"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="153"/>
    <path d="M256 188 L256 256 L307 307"/>
  </g>
</svg>
